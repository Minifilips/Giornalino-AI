name: Recap AI mattutino
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 07:00 ora italiana legale (dal 25/10 usa "0 6 * * *")
  workflow_dispatch: {}    # permette di lanciarlo a mano dal tasto "Run workflow"
jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - run: python recap.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
