name: Recap AI mattutino
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 07:00 ora italiana legale (dal 25/10 usa "0 6 * * *")
  workflow_dispatch: {}    # permette di lanciarlo a mano dal tasto "Run workflow"
jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu
      - run: pip install weasyprint anthropic
      - run: python recap.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
